<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matteträning">
<title>Matteträning</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173126;background:#f6f7ef}
*{box-sizing:border-box} body{margin:0;min-height:100vh}
main{max-width:720px;margin:auto;padding:24px 18px 48px;text-align:center}
h1{font-size:clamp(30px,7vw,48px);margin:12px 0 4px}.sub{margin:0 0 20px;color:#617067}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}
.level{border:0;border-radius:14px;padding:12px 4px;background:#e5e9df;font-size:17px;font-weight:700;color:#33463c}
.level.active{background:#2f7651;color:white;transform:translateY(-1px)}
.card{background:white;border-radius:28px;padding:28px 22px;box-shadow:0 8px 28px #17312614}
.levelname{font-weight:700;color:#577063;margin-bottom:18px}
.sum{display:inline-grid;grid-template-columns:42px auto;align-items:end;font:600 clamp(48px,13vw,76px)/1.02 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:right;letter-spacing:3px}
.op{grid-column:1}.a{grid-column:2}.op2{grid-column:1}.b{grid-column:2}
.line{grid-column:1/3;border-top:5px solid #173126;margin-top:8px;padding-top:12px}
input{width:min(310px,70vw);font:600 clamp(42px,12vw,68px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:right;border:3px solid #c9d3ca;border-radius:14px;padding:8px 12px;color:#173126;background:#fbfcf9}
input:focus{outline:4px solid #acd8bc;border-color:#2f7651}
.actions{display:flex;gap:10px;justify-content:center;margin-top:20px}
button.action{border:0;border-radius:16px;padding:15px 22px;font-size:19px;font-weight:750;background:#2f7651;color:white}
button.secondary{background:#e7ece6;color:#294136}
.feedback{height:42px;font-size:23px;font-weight:800;margin-top:14px}.right{color:#20834d}.wrong{color:#b04a3b}
.stats{margin-top:18px;color:#617067;font-weight:650}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.piece{position:absolute;top:-20px;font-size:24px;animation:fall 1.15s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
@media(max-width:500px){main{padding-top:12px}.levels{gap:5px}.level{font-size:15px;padding:11px 2px}.card{padding:24px 12px}}
</style>
</head>
<body>
<main>
<h1>Matteträning</h1>
<p class="sub">Välj nivå och kör så länge du vill.</p>
<div class="levels" id="levels"></div>
<section class="card">
<div class="levelname" id="levelname"></div>
<div class="sum">
<div class="a" id="a"></div><div class="op2" id="op"></div><div class="b" id="b"></div>
<div class="line"><input id="answer" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Svar"></div>
</div>
<div class="actions"><button class="action" id="check">Svara</button><button class="action secondary" id="new">Ny uppgift</button></div>
<div class="feedback" id="feedback"></div>
</section>
<div class="stats" id="stats"></div>
</main>
<div class="confetti" id="confetti"></div>
<script>
const levels=[
 {name:"Addition utan övergång",short:"1",op:"+",make:addNoCarry},
 {name:"Addition med övergång",short:"2",op:"+",make:addCarry},
 {name:"Subtraktion utan växling",short:"3",op:"−",make:subNoBorrow},
 {name:"Subtraktion med växling",short:"4",op:"−",make:subBorrow},
 {name:"Multiplikation",short:"5",op:"×",make:multiply}
];
let level=+(localStorage.level||0), problem, locked=false;
const $=id=>document.getElementById(id), rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function digits(n){return [Math.floor(n/100)%10,Math.floor(n/10)%10,n%10]}
function addNoCarry(){
 let a=[],b=[]; for(let i=0;i<3;i++){let x=rnd(i===0?1:0,9),y=rnd(0,9-x);a.push(x);b.push(y)}
 return [a[0]*100+a[1]*10+a[2],b[0]*100+b[1]*10+b[2]];
}
function addCarry(){let a,b;do{a=rnd(101,899);b=rnd(101,999-a)}while(!digits(a).some((d,i)=>d+digits(b)[i]>=10));return[a,b]}
function subNoBorrow(){let a=rnd(100,999),ad=digits(a),bd=ad.map((d,i)=>rnd(i===0?0:0,d));let b=bd[0]*100+bd[1]*10+bd[2];return[a,b]}
function subBorrow(){let a,b;do{a=rnd(101,999);b=rnd(10,a)}while(!digits(a).some((d,i)=>digits(b)[i]>d));return[a,b]}
function multiply(){return[rnd(2,12),rnd(2,12)]}
function renderLevels(){
 $("levels").innerHTML=levels.map((x,i)=>`<button class="level ${i===level?"active":""}" data-i="${i}" aria-label="Nivå ${i+1}: ${x.name}">${x.short}</button>`).join("");
 document.querySelectorAll(".level").forEach(b=>b.onclick=()=>{level=+b.dataset.i;localStorage.level=level;renderLevels();next()})
}
function next(){locked=false;problem=levels[level].make();$("a").textContent=problem[0];$("b").textContent=problem[1];$("op").textContent=levels[level].op;$("levelname").textContent="Nivå "+(level+1)+" · "+levels[level].name;$("answer").value="";$("feedback").textContent="";$("feedback").className="feedback";setTimeout(()=>$("answer").focus(),50)}
function expected(){if(level<2)return problem[0]+problem[1];if(level<4)return problem[0]-problem[1];return problem[0]*problem[1]}
function check(){
 if(locked||$("answer").value==="")return;
 if(+$("answer").value===expected()){locked=true;$("feedback").textContent="Rätt! 🎉";$("feedback").className="feedback right";let n=+(localStorage.rightToday||0)+1;localStorage.rightToday=n;updateStats();celebrate();setTimeout(next,1100)}
 else{$("feedback").textContent="Försök igen 💪";$("feedback").className="feedback wrong";$("answer").select()}
}
function updateStats(){let n=+(localStorage.rightToday||0);$("stats").textContent=n+" rätt på den här enheten"}
function celebrate(){const c=$("confetti"),chars=["⭐","🎉","✨","●"];for(let i=0;i<22;i++){let s=document.createElement("span");s.className="piece";s.textContent=chars[rnd(0,chars.length-1)];s.style.left=rnd(3,97)+"%";s.style.animationDelay=rnd(0,250)+"ms";c.appendChild(s);setTimeout(()=>s.remove(),1600)}}
$("check").onclick=check;$("new").onclick=next;$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")check()});
renderLevels();updateStats();next();
</script>
</body>
</html>
