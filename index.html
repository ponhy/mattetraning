<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#edf6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matteträning">
<title>Matteträning</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#14395f;background:#edf6ff}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:linear-gradient(180deg,#e8f4ff 0,#f7fbff 70%)}
main{max-width:720px;margin:auto;padding:24px 18px 48px;text-align:center}
h1{font-size:clamp(30px,7vw,48px);margin:12px 0 4px;color:#0d4f8c}.sub{margin:0 0 20px;color:#55728e}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}
.level{border:0;border-radius:14px;padding:12px 4px;background:#dcecff;font-size:17px;font-weight:700;color:#24527b}
.level.active{background:#1769b0;color:white;transform:translateY(-1px);box-shadow:0 5px 14px #1769b033}
.card{background:#fff;border-radius:28px;padding:28px 22px;box-shadow:0 10px 32px #1769b01c}
.levelname{font-weight:700;color:#416989;margin-bottom:18px}
.paper{--cell:clamp(48px,12vw,70px);display:inline-grid;grid-template-columns:36px repeat(var(--columns),var(--cell));text-align:center;background:#fcfeff;border-radius:18px;padding:10px 10px 16px;box-shadow:inset 0 0 0 1px #d9e9f7}
.cell{height:var(--cell);display:flex;align-items:center;justify-content:center;font:600 clamp(32px,9vw,52px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;position:relative}
.place{font-size:12px;color:#7892aa;height:26px}
.note,.answer{width:100%;border:0;color:#14395f;background:transparent;cursor:pointer;touch-action:manipulation}
.note{height:42px;font:600 25px ui-monospace,SFMono-Regular,Menlo,monospace;color:#1769b0}
.note-row{padding:1px 3px;height:46px}
.blank{height:46px}
.answer-row{border-top:3px solid #14395f;padding:7px 3px 0;height:calc(var(--cell) + 12px)}
.answer{height:var(--cell);font:600 clamp(32px,9vw,52px) ui-monospace,SFMono-Regular,Menlo,monospace}
.selected{color:#0d5da4;background:#e8f3ff;border-radius:9px;box-shadow:inset 0 -3px 0 #1e72c9}
.note.selected:empty:after,.answer.selected:empty:after{content:'|';color:#1e72c9;font-weight:400;animation:blink 1s steps(1) infinite}
.changed{text-decoration:line-through;text-decoration-color:#c33f50;text-decoration-thickness:2px}
button:focus-visible{outline:3px solid #1e72c9;outline-offset:2px}
.hint{font-size:15px;color:#55728e;line-height:1.45;margin:16px 0 8px;min-height:44px}
.keypad{max-width:310px;margin:12px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{border:0;border-radius:12px;min-height:48px;font-size:25px;font-weight:650;background:#e1effb;color:#14395f;touch-action:manipulation}
.key.utility{font-size:16px}
.actions{display:flex;gap:10px;justify-content:center;margin-top:20px}
button.action{border:0;border-radius:16px;padding:15px 22px;font-size:19px;font-weight:750;background:#1769b0;color:white}
button.secondary{background:#e1effb;color:#24527b}
.feedback{height:42px;font-size:23px;font-weight:800;margin-top:14px}.right{color:#16834b}.wrong{color:#ba3c4c}
.stats{margin-top:18px;color:#55728e;font-weight:650}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.piece{position:absolute;top:-20px;font-size:24px;animation:fall 1.15s ease-in forwards}
@keyframes blink{50%{opacity:0}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
@media(prefers-reduced-motion:reduce){.piece{animation:none;display:none}.note.selected:empty:after,.answer.selected:empty:after{animation:none}}
@media(max-width:500px){main{padding-top:12px}.levels{gap:5px}.level{font-size:15px;padding:11px 2px}.card{padding:24px 12px}.paper{padding-left:6px;padding-right:6px}}
</style>
</head>
<body>
<main>
<h1>Matteträning</h1>
<p class="sub">Välj nivå och kör så länge du vill.</p>
<div class="levels" id="levels"></div>
<section class="card">
<div class="levelname" id="levelname"></div>
<div class="paper" id="paper" role="group" aria-label="Uppställning"></div>
<p class="hint" id="hint"></p>
<div class="keypad" id="keypad" role="group" aria-label="Siffertangentbord"></div>
<div class="actions"><button class="action" id="check">Svara</button><button class="action secondary" id="new">Ny uppgift</button></div>
<div class="feedback" id="feedback" role="status" aria-live="polite"></div>
</section>
<div class="stats" id="stats"></div>
</main>
<div class="confetti" id="confetti"></div>
<script>
const levels=[
 {name:"Addition utan övergång",short:"1",op:"+",make:addNoCarry},
 {name:"Addition med övergång",short:"2",op:"+",make:addCarry},
 {name:"Subtraktion utan växling",short:"3",op:"−",make:subNoBorrow},
 {name:"Subtraktion med växling",short:"4",op:"−",make:subBorrow},
 {name:"Multiplikation",short:"5",op:"×",make:multiply}
];
function saved(key){try{return localStorage.getItem(key)}catch{return null}}
function save(key,value){try{localStorage.setItem(key,value)}catch{}}
let level=Math.min(4,Math.max(0,Math.floor(Number(saved('level'))||0))), problem, locked=false;
let answer=[], notes=[], columns=3, active={kind:'answer',col:2}, nextTimer;
let rightCount=Number(saved('rightToday'))||0;
const $=id=>document.getElementById(id), rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function digits(n){return [Math.floor(n/100)%10,Math.floor(n/10)%10,n%10]}
function addNoCarry(){
 let a=[],b=[]; for(let i=0;i<3;i++){let x=rnd(i===0?1:0,9),y=rnd(0,9-x);a.push(x);b.push(y)}
 return [a[0]*100+a[1]*10+a[2],b[0]*100+b[1]*10+b[2]];
}
function addCarry(){let a,b;do{a=rnd(101,899);b=rnd(101,999-a)}while(!digits(a).some((d,i)=>d+digits(b)[i]>=10));return[a,b]}
function subNoBorrow(){let a=rnd(100,999),ad=digits(a),bd=ad.map((d,i)=>rnd(i===0?0:0,d));let b=bd[0]*100+bd[1]*10+bd[2];return[a,b]}
function subBorrow(){let a,b;do{a=rnd(101,999);b=rnd(10,a)}while(!digits(a).some((d,i)=>digits(b)[i]>d));return[a,b]}
function multiply(){return[rnd(2,12),rnd(2,12)]}
function renderLevels(){
 $("levels").innerHTML=levels.map((x,i)=>`<button class="level ${i===level?"active":""}" data-i="${i}" aria-label="Nivå ${i+1}: ${x.name}">${x.short}</button>`).join("");
 document.querySelectorAll(".level").forEach(b=>b.onclick=()=>{level=+b.dataset.i;save('level',level);renderLevels();next()})
}
const placeNames=['ental','tiotal','hundratal','tusental'];
function next(){
 clearTimeout(nextTimer);locked=false;problem=levels[level].make();
 columns=Math.max(3,String(problem[0]).length,String(problem[1]).length);
 answer=Array(columns).fill('');notes=Array(columns).fill('');active={kind:'answer',col:columns-1};
 $("levelname").textContent="Nivå "+(level+1)+" · "+levels[level].name;
 $("feedback").textContent="";$("feedback").className="feedback";renderPaper();
}
function expected(){if(level<2)return problem[0]+problem[1];if(level<4)return problem[0]-problem[1];return problem[0]*problem[1]}
function renderPaper(){
 const subtract=level===2||level===3;
 const top=String(problem[0]).padStart(columns,' '), bottom=String(problem[1]).padStart(columns,' ');
 const place=i=>placeNames[columns-1-i];
 let html='<div></div>';
 for(let i=0;i<columns;i++)html+=`<div class="place">${place(i)}</div>`;
 html+='<div class="blank"></div>';
 for(let i=0;i<columns;i++)html+=`<div class="note-row"><button class="note ${active.kind==='note'&&active.col===i?'selected':''}" data-kind="note" data-col="${i}" aria-label="${subtract?'Nytt värde vid lån':'Minnessiffra'}, ${place(i)}${notes[i]!==''?', '+notes[i]:''}" aria-pressed="${active.kind==='note'&&active.col===i}">${notes[i]}</button></div>`;
 html+='<div class="cell"></div>';
 for(let i=0;i<columns;i++)html+=`<div class="cell ${subtract&&notes[i]!==''?'changed':''}">${top[i].trim()}</div>`;
 html+=`<div class="cell">${levels[level].op}</div>`;
 for(let i=0;i<columns;i++)html+=`<div class="cell">${bottom[i].trim()}</div>`;
 html+='<div class="answer-row"></div>';
 for(let i=0;i<columns;i++)html+=`<div class="answer-row"><button class="answer ${active.kind==='answer'&&active.col===i?'selected':''}" data-kind="answer" data-col="${i}" aria-label="Svar, ${place(i)}${answer[i]!==''?', '+answer[i]:''}" aria-pressed="${active.kind==='answer'&&active.col===i}">${answer[i]}</button></div>`;
 $('paper').style.setProperty('--columns',columns);$('paper').innerHTML=html;
 $('paper').querySelectorAll('button').forEach(b=>{b.disabled=locked;b.onclick=()=>{active={kind:b.dataset.kind,col:Number(b.dataset.col)};renderPaper()}});
 $('hint').textContent=active.kind==='note'?(subtract?'Skriv det nya värdet, t.ex. 12. Tryck sedan ovanför nästa siffra eller på Klar.':'Skriv minnessiffran. Tryck sedan ovanför nästa siffra eller på Klar.'):
 (subtract?'Börja med entalen till höger. Tryck ovanför en siffra för att anteckna lån.':'Börja med entalen till höger. Skriv minnessiffror ovanför talet.');
 $('keypad').querySelector('[data-key="done"]').textContent=active.kind==='note'?'Klar':'Rensa';
}
function enterDigit(d){
 if(locked)return;
 if(active.kind==='answer'){
 answer[active.col]=String(d);
 if(active.col>0)active.col--;
 }else{
 const old=notes[active.col];
 const candidate=old+String(d);
 // Lån kan ge 10 till 19; minnessiffror är en enda siffra.
 notes[active.col]=(level===2||level===3)&&old==='1'&&Number(candidate)<=19?candidate:String(d);
 }
 renderPaper();
}
function erase(){
 if(locked)return;
 const values=active.kind==='note'?notes:answer;
 if(active.kind==='answer'&&values[active.col]===''&&active.col<columns-1)active.col++;
 values[active.col]=values[active.col].slice(0,-1);renderPaper();
}
function done(){
 if(locked)return;
 if(active.kind==='note')active={kind:'answer',col:Math.max(0,answer.findLastIndex(x=>x===''))};
 else answer[active.col]='';
 renderPaper();
}
function check(){
 if(locked)return;
 const written=answer.join('').trim();
 const first=answer.findIndex(x=>x!=='');
 if(first<0||answer.slice(first).some(x=>x==='')){
 $('feedback').textContent='Fyll i svaret från höger.';$('feedback').className='feedback';return;
 }
 if(Number(written)===expected()){
 locked=true;$("feedback").textContent="Rätt! 🎉";$("feedback").className="feedback right";
 rightCount++;save('rightToday',rightCount);updateStats();celebrate();renderPaper();nextTimer=setTimeout(next,1400);
 }else{$("feedback").textContent="Försök igen 💪";$("feedback").className="feedback wrong";}
}
function updateStats(){$('stats').textContent=rightCount+' rätt på den här enheten'}
function celebrate(){const c=$("confetti"),chars=["⭐","🎉","✨","●"];for(let i=0;i<22;i++){let s=document.createElement("span");s.className="piece";s.textContent=chars[rnd(0,chars.length-1)];s.style.left=rnd(3,97)+"%";s.style.animationDelay=rnd(0,250)+"ms";c.appendChild(s);setTimeout(()=>s.remove(),1600)}}
$('keypad').innerHTML=[1,2,3,4,5,6,7,8,9,'erase',0,'done'].map(k=>`<button class="key ${typeof k==='string'?'utility':''}" data-key="${k}" aria-label="${k==='erase'?'Sudda':k==='done'?'Klar eller rensa':k}">${k==='erase'?'Sudda':k==='done'?'Rensa':k}</button>`).join('');
$('keypad').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.key;if(k==='erase')erase();else if(k==='done')done();else enterDigit(k)});
$("check").onclick=check;$("new").onclick=next;
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(/^\d$/.test(e.key)){e.preventDefault();enterDigit(e.key)}
 else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();erase()}
 else if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();if(active.kind==='note')done();else check()}
 else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&!locked){e.preventDefault();active.col=Math.max(0,Math.min(columns-1,active.col+(e.key==='ArrowLeft'?-1:1)));renderPaper()}
});
renderLevels();updateStats();next();
</script>
</body>
</html>
